<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Integra Hub — central de integrações entre loja virtual, planilhas, banco, transportadora e ERP. Demonstração da EMERICH Tech Solution." />
    <meta name="theme-color" content="#0f4a96" />
    <title>Integra Hub · Nortex Distribuidora</title>
    <script>
      try {
        var t = localStorage.getItem('integra-hub-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
